    <script>
      (function() {
        // Suppress Vite HMR WebSocket closing warning in cloud preview environment
        var originalError = console.error;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1)) {
            return;
          }
          originalError.apply(console, arguments);
        };

        // Stub vite-hmr websocket if invoked in iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || protocols === 'vite-hmr')) {
              var listeners = {};
              var stub = {
                readyState: 1,
                send: function() {},
                close: function() {},
                addEventListener: function(evt, fn) {
                  listeners[evt] = listeners[evt] || [];
                  listeners[evt].push(fn);
                  if (evt === 'open') {
                    setTimeout(function() { fn({ type: 'open' }); }, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              return stub;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Global safeguard: Prevent QuotaExceededError from crashing on localStorage/sessionStorage
        if (typeof window !== 'undefined' && window.Storage && window.Storage.prototype) {
          var origSetItem = window.Storage.prototype.setItem;
          window.Storage.prototype.setItem = function(key, value) {
            try {
              origSetItem.apply(this, arguments);
            } catch (err) {
              if (err && (err.name === 'QuotaExceededError' || err.code === 22 || err.number === -2147024882)) {
                // Try clearing heavy caches
                try {
                  window.localStorage.removeItem('cupid_matches_v1');
                  window.localStorage.removeItem('cupid_messages_v1');
                  window.localStorage.removeItem('cupid_managed_profiles_v1');
                } catch (e) {}
                return;
              }
              throw err;
            }
          };
        }
      })();
    </script>
