<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Squircle Gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1922" />
      <stop offset="50%" stop-color="#121016" />
      <stop offset="100%" stop-color="#070608" />
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E7E" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7B2CBF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF9E7D" stop-opacity="0.5" />
    </linearGradient>

    <!-- Core Cupid Neon Gradient -->
    <linearGradient id="cupidNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63" />
      <stop offset="35%" stop-color="#FF477E" />
      <stop offset="70%" stop-color="#FF758F" />
      <stop offset="100%" stop-color="#FF9E7D" />
    </linearGradient>

    <!-- Wing Accent Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA8BA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0.3" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF2E63" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#appBgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="url(#rimGrad)" stroke-width="4" />
  
  <!-- Subtle Internal Radial Ambient Lighting -->
  <circle cx="256" cy="245" r="180" fill="url(#centerGlow)" />

  <!-- Cupid Heart with Wings and Dynamic Flame Crest (App Icon Insignia) -->
  <g transform="translate(4, -6)" filter="url(#neonGlow)">
    <!-- Left Wing Arc -->
    <path d="M175 190 C125 150 90 195 80 230 C75 250 88 262 105 258 C135 250 160 230 185 220 Z" fill="url(#wingGrad)" />
    
    <!-- Right Wing Arc -->
    <path d="M337 190 C387 150 422 195 432 230 C437 250 424 262 407 258 C377 250 352 230 327 220 Z" fill="url(#wingGrad)" />

    <!-- Main Cupid Heart Body -->
    <path d="M256 385 C256 385 130 295 130 198 C130 138 175 105 225 105 C246 105 254 116 256 122 C258 116 266 105 287 105 C337 105 382 138 382 198 C382 295 256 385 256 385 Z" fill="url(#cupidNeonGrad)" />

    <!-- Inner Glossy Flare Highlight -->
    <path d="M165 185 C165 145 195 125 225 125 C232 125 237 127 242 130 C220 142 178 178 170 215 C166 205 165 195 165 185 Z" fill="#FFFFFF" opacity="0.35" />

    <!-- Cupid Arrow Sparkle Piercing Dynamic Path -->
    <path d="M120 370 L150 340" stroke="#FFA8BA" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <polygon points="380,140 405,120 395,150" fill="#FFA8BA" opacity="0.9" />

    <!-- Starburst Twinkle in Top Right of Heart -->
    <g transform="translate(325, 145)">
      <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z" fill="#FFFFFF" opacity="0.95" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>
  </g>
</svg>
